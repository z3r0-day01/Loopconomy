[package]
name = "luma"
version = "1.1.0"
edition = "2021"
description = "LUMA - Loopconomy Unified Manager Application"
authors = ["Loopconomy Team"]
license = "Apache-2.0"

[dependencies]
ratatui = "0.26"
crossterm = "0.27"
reqwest = { version = "0.11", features = ["json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread", "macros"] }
chrono = "0.4"
dirs = "5.0"
sha3 = "0.10"
hex = "0.4"
regex = "1.10"
base64 = "0.22"

[features]
default = ["blocking"]
blocking = ["reqwest/blocking"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
